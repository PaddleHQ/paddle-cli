name: Release on Push

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  release_on_push:
    # goreleases.yml waits for a check with this name before releasing.
    name: Create release on push to main branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEPSECURITY_POLICY_STORE_API_KEY }}

      - uses: step-security/release-on-push-action@b9dee0685e99e905fe90cba8ba9ed92c7f3806b4 # v0.28.6
        with:
          bump_version_scheme: norelease
          use_github_release_notes: true
